[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-grove"
version = "1.3.0"
description = "枝序：思维导图式任务拆解与管理器，支持树状规划、拖拽整理与定时提醒"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials==6.12.0"]
license = "MIT"

[project.scripts]
task-grove = "task_grove.app:main"

[tool.setuptools.packages.find]
include = ["task_grove*"]
